name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Ruff and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: >-
          python -m pip install
          -r requirements-api-xgboost.txt
          -r requirements-ui.txt
          -r requirements-dev.txt
          -r requirements-data.txt
          -r requirements-model.txt

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false

      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui
          push: false
